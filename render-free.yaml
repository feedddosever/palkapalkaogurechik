# Render Blueprint for Leash on Render's free tier (no payment method needed):
# Dashboard → New → Blueprint → pick this repo → set "Blueprint Path" to render-free.yaml.
# Trade-offs: the web service sleeps after 15 idle minutes (about a minute to wake), the free
# database expires after 30 days (upgradeable within 14 more days), and there's no hourly job
# ("End week now" in the app runs the same renewal + reconciliation). Database migrations run
# when the app starts.
services:
  - type: web
    name: leash
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    # The app uses ~300 MB; cap the heap on the 512 MB instance (not at build time).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: RECEIPT_SIGNING_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: LAB_DAILY_BUDGET_USD
        value: "3"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: JUDGE_BUYER_EMAIL
        sync: false
      - key: JUDGE_BUYER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false

databases:
  - name: leash-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
